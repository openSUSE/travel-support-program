services:
  web:
    image: tsp:latest
    build:
      context: .
      args:
        CONTAINER_USERID: ${CONTAINER_USERID:-1000}
    shm_size: 1gb
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
  db:
    image: mariadb:11.4
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: tsp

