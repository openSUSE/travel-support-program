# Inherit style from another configuration
inherit_from: .rubocop_todo.yml

# Preserve both generated exclusions and the explicit exceptions below.
inherit_mode:
  merge:
    - Exclude

plugins:
 - rubocop-rails
 - rubocop-rspec
 - rubocop-capybara

Metrics/ClassLength:
  Exclude:
    - app/models/ability.rb

Metrics/ModuleLength:
  Exclude:
    - app/helpers/application_helper.rb

# Apply rule to all cops
AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - 'db/schema.rb'
    - 'vendor/bundle/**/*'
    - 'bundle/**/*'
    - 'config/**/*'
    - 'bin/*'

# Keep explicit hash values when moving from Ruby 2.7 to Ruby 3.1.
Style/HashSyntax:
  EnforcedShorthandSyntax: never
